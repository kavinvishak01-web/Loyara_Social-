name: Keep tokens alive

# Threads tokens last 60 days: this renews it weekly and saves it back to Secrets.
# LinkedIn tokens also last 60 days but can't be renewed automatically for personal
# profiles: this checks it weekly and opens an issue (GitHub emails you) when it stops working.
on:
  schedule:
    - cron: "0 22 * * 0"   # Monday 03:30 IST
  workflow_dispatch:

permissions:
  issues: write

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - name: Renew Threads token
        env:
          OLD_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          RESP=$(curl -s "https://graph.threads.net/refresh_access_token?grant_type=th_refresh_token&access_token=${OLD_TOKEN}")
          NEW=$(echo "$RESP" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("access_token",""))')
          if [ -z "$NEW" ]; then
            echo "$RESP" | python3 -c 'import sys,json; d=json.load(sys.stdin); d.pop("access_token",None); print(d)'
            exit 1
          fi
          echo "::add-mask::$NEW"
          gh secret set THREADS_ACCESS_TOKEN --repo "${{ github.repository }}" --body "$NEW"
          echo "Threads token renewed."

      - name: Check LinkedIn token
        if: always()
        env:
          LI_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -z "$LI_TOKEN" ] && { echo "No LinkedIn token set."; exit 0; }
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $LI_TOKEN" https://api.linkedin.com/v2/userinfo)
          if [ "$CODE" != "200" ]; then
            gh issue create --repo "${{ github.repository }}" --title "Renew the LinkedIn token" \
              --body "LinkedIn returned $CODE. Generate a new token (SETUP.md, LinkedIn step 4) and update the LINKEDIN_ACCESS_TOKEN secret."
            exit 1
          fi
          echo "LinkedIn token OK."
